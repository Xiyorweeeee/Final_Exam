<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>គណនាថ្លៃផ្ញើរយានជំនិះ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: "Kantumruy Pro", "Noto Sans Khmer", sans-serif; padding: 20px; }
        select, input, button { font-family: inherit; }
        .box, .info {
            border: 2px solid #c62828;
            padding: 25px;
            max-width: 380px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        h2 { text-align: center; color: #222; }
        .field { margin-bottom: 14px; }
        label { display: block; margin-bottom: 6px; }

        select, input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            font-size: 16px;
            border: 1.5px solid #222;
            border-radius: 10px;
        }
        button {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            color: #222;
            border: 2px solid #c62828;
            border-radius: 10px;
            cursor: pointer;
        }
        .seg { display: flex; gap: 10px; }
        .seg label { flex: 1; margin: 0; }
        .seg input { display: none; }
        .seg span {
            display: block;
            text-align: center;
            padding: 12px;
            border: 1.5px solid #222;
            border-radius: 10px;
            cursor: pointer;
        }
        .seg input:checked + span {
            background: #c62828;
            color: #fff;
            border-color: #c62828;
        }
        #total {
            margin-top: 14px;
            padding: 14px;
            text-align: center;
            font-weight: bold;
            background: #eee;
            border-radius: 10px;
        }
        .info ul { list-style: none; padding-left: 20px; margin: 6px 0 14px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>គណនាថ្លៃផ្ញើរយានជំនិះ</h2>

        <div class="field">
            <label>ជ្រើសរើស យានជំនិះ:</label>
            <div class="seg">
                <label><input type="radio" name="vehicle" value="car" checked><span>ឡាន</span></label>
                <label><input type="radio" name="vehicle" value="moto"><span>ម៉ូតូ</span></label>
            </div>
        </div>

        <div class="field">
            <label for="timeIn">ម៉ោងចូល</label>
            <input type="time" id="timeIn">
        </div>

        <div class="field">
            <label for="timeOut">ម៉ោងចេញ</label>
            <input type="time" id="timeOut">
        </div>

        <div class="field">
            <label for="riel">ថ្លៃផ្ញើរ រៀល</label>
            <input type="text" id="riel" placeholder="៛" readonly>
        </div>

        <div class="field">
            <label for="dollar">ថ្លៃផ្ញើរ ដុល្លា</label>
            <input type="text" id="dollar" placeholder="$" readonly>
        </div>

        <button type="button" onclick="calculate()">គណនា</button>
        <div id="total">រយៈពេលចតសរុប: -</div>
    </div>
    <script>
        const EXCHANGE_RATE = 4000; // 1 dollar = 4000 riel

        const rates = {
            car:  { normal: 500, over: 1000 },
            moto: { normal: 200, over: 300 }
        };

        function calculate() {
            let vehicle = document.querySelector('input[name="vehicle"]:checked').value;
            let timeIn = document.getElementById('timeIn').value;
            let timeOut = document.getElementById('timeOut').value;

            if (timeIn === '' || timeOut === '') {
                alert('សូមបញ្ចូលម៉ោងចូល និងម៉ោងចេញ');
                return;
            }

            let [inH, inM] = timeIn.split(':').map(Number);
            let [outH, outM] = timeOut.split(':').map(Number);
            let diff = (outH * 60 + outM) - (inH * 60 + inM);

            if (diff < 0) {
                diff += 24 * 60; // parked overnight
            }
            if (diff === 0) {
                alert('ម៉ោងចូល និងម៉ោងចេញដូចគ្នា');
                return;
            }

            let hours = Math.ceil(diff / 60);
            let normalHours = Math.min(hours, 8);
            let overHours = Math.max(hours - 8, 0);

            let rate = rates[vehicle];
            let totalRiel = normalHours * rate.normal + overHours * rate.over;
            let totalDollar = totalRiel / EXCHANGE_RATE;

            let h = Math.floor(diff / 60);
            let m = diff % 60;
            let text = h + ' ម៉ោង';
            if (m > 0) text += ' ' + m + ' នាទី';
            document.getElementById('total').textContent = 'រយៈពេលចតសរុប: ' + text;

            document.getElementById('riel').value = totalRiel.toLocaleString() + ' ៛';
            document.getElementById('dollar').value = totalDollar.toFixed(2) + ' $';
        }
    </script>
</body>
</html>
